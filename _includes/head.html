<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if site.google_analytics and site.google_analytics != "" and jekyll.environment == "production" %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
{% else %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
{% endif %}
<meta name="referrer" content="strict-origin-when-cross-origin">
{% if page.noindex %}
<meta name="robots" content="noindex, follow">
{% endif %}
{% seo %}
{% feed_meta %}
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% include schema-breadcrumbs.html %}
