<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="pdf-pw-title pdf-pw-desc">
  <title id="pdf-pw-title">How Entering Your Known Password Once Saves an Unprotected PDF Copy</title>
  <desc id="pdf-pw-desc">Three-step workflow: Open protected PDF with your known password, choose Print to PDF or Unlock tool, and save a new unlocked PDF copy.</desc>
  <rect width="760" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">How to Save an Unlocked Copy of a PDF You Already Own</text>

  <rect x="30" y="66" width="215" height="184" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="46" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#92400e">1. Encrypted Original</text>
  <text x="46" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Asks for password on</text>
  <text x="46" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">  every single open</text>
  <text x="46" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#b91c1c">• Rejected by most</text>
  <text x="46" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#b91c1c">  portal upload forms</text>

  <path d="M254 158h18m-6-6l6 6-6 6" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="280" y="66" width="205" height="184" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="296" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#065f46">2. Enter Password Once</text>
  <text x="296" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">• Authenticate ownership</text>
  <text x="296" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">• Print → Save as PDF</text>
  <text x="296" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">  or use PDF Unlock</text>

  <path d="M494 158h18m-6-6l6 6-6 6" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="520" y="66" width="210" height="184" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="536" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#065f46">3. Unlocked PDF Copy</text>
  <text x="536" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Opens immediately</text>
  <text x="536" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Accepted by loan, tax,</text>
  <text x="536" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">  and visa portals</text>
  <text x="536" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#065f46">Store securely on your device</text>
</svg>
