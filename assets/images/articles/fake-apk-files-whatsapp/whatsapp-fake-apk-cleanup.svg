<svg xmlns="http://www.w3.org/2000/svg" width="760" height="295" viewBox="0 0 760 295" role="img" aria-labelledby="apk-scam-title apk-scam-desc">
  <title id="apk-scam-title">How Malicious WhatsApp APK Files Steal OTPs and Emergency Cleanup Order</title>
  <desc id="apk-scam-desc">Diagram showing fake Wedding Card or KYC APK lures requesting SMS and Accessibility permissions on the left, and the 4-step emergency cleanup order on the right.</desc>
  <rect width="760" height="295" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Why a Real Invitation or Bill Is Never an ".apk" File</text>

  <rect x="30" y="64" width="338" height="202" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Common WhatsApp APK Traps</text>
  <text x="48" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0f172a">• Wedding_Invitation_Card.apk</text>
  <text x="48" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0f172a">• SBI_PAN_KYC_Update.apk</text>
  <text x="48" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0f172a">• eParivahan_Traffic_Challan.apk</text>
  <text x="48" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">What it steals: Reads &amp; forwards SMS</text>
  <text x="48" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">bank OTPs + hijacks Accessibility</text>

  <rect x="392" y="64" width="338" height="202" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="410" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#065f46">If Already Installed: Do This Now</text>
  <text x="410" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">1. Turn ON Airplane Mode immediately</text>
  <text x="410" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">2. Reboot in Safe Mode &amp; uninstall app</text>
  <text x="410" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">3. Check SMS Forwarding &amp; Device Admin</text>
  <text x="410" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">4. Reset passwords from a SEPARATE device</text>
  <text x="410" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#065f46">5. Call bank fraud desk &amp; 1930 helpline</text>
</svg>
