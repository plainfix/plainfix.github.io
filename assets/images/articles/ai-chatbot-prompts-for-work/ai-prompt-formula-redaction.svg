<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="ai-prompt-title ai-prompt-desc">
  <title id="ai-prompt-title">Five-Part AI Prompt Structure and Redaction Safety Boundary</title>
  <desc id="ai-prompt-desc">Diagram showing the 5 building blocks of an effective work prompt (Context, Task, Format, Constraints, Example) and the redaction barrier blocking passwords, OTPs, IDs, and client secrets.</desc>
  <rect width="760" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">The 5-Part Work Prompt Formula + Privacy Redaction Check</text>

  <rect x="30" y="64" width="440" height="196" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#065f46">5 Building Blocks of a Reliable Prompt</text>
  <text x="48" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">1. <tspan font-weight="700">Context:</tspan> Who is the audience and what is the situation?</text>
  <text x="48" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">2. <tspan font-weight="700">Task:</tspan> Specific action verb (rewrite, extract, compare)</text>
  <text x="48" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">3. <tspan font-weight="700">Format:</tspan> Markdown table, 5 bullet points, or JSON</text>
  <text x="48" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">4. <tspan font-weight="700">Constraints:</tspan> Word limit, tone, "use only provided text"</text>
  <text x="48" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">5. <tspan font-weight="700">Example:</tspan> One sample input → output row</text>

  <rect x="490" y="64" width="240" height="196" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="508" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Never Paste Into Chat</text>
  <text x="508" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Passwords, API keys &amp; OTPs</text>
  <text x="508" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Aadhaar, PAN, SSN, Passports</text>
  <text x="508" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Unredacted bank/medical files</text>
  <text x="508" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Private client names &amp; code</text>
  <text x="508" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Replace with [CLIENT_A] first</text>
</svg>
