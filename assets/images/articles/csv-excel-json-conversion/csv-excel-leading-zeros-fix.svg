<svg xmlns="http://www.w3.org/2000/svg" width="760" height="295" viewBox="0 0 760 295" role="img" aria-labelledby="csv-json-title csv-json-desc">
  <title id="csv-json-title">Why Double-Clicking a CSV in Excel Corrupts Leading Zeros and Long IDs</title>
  <desc id="csv-json-desc">Comparison of raw CSV data vs corrupted auto-typed Excel values vs clean Data Import / JSON conversion.</desc>
  <rect width="760" height="295" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">How to Prevent Excel From Dropping Leading Zeros &amp; Long IDs</text>

  <rect x="28" y="64" width="222" height="202" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Original Raw CSV</text>
  <text x="44" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#0f172a">pin: "011001"</text>
  <text x="44" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#0f172a">awb: "9876543210123456"</text>
  <text x="44" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#0f172a">lot: "10-12"</text>
  <text x="44" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Plain text on disk is</text>
  <text x="44" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">still intact before saving.</text>

  <rect x="269" y="64" width="222" height="202" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="285" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">2. Double-Clicked in Excel</text>
  <text x="285" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#b91c1c">11001  (0 dropped!)</text>
  <text x="285" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#b91c1c">9.87654E+15 (Zeroed!)</text>
  <text x="285" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#b91c1c">12-Oct (Turned to date!)</text>
  <text x="285" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Pressing Ctrl+S overwrites</text>
  <text x="285" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">your CSV permanently!</text>

  <rect x="510" y="64" width="220" height="202" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="526" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#065f46">3. Safe Import / JSON</text>
  <text x="526" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a">• Data → From Text/CSV</text>
  <text x="526" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a">• Set ID columns to "Text"</text>
  <text x="526" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0f172a">• Use UTF-8 encoding</text>
  <text x="526" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#065f46">Preserves every zero,</text>
  <text x="526" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#065f46">digit, and ISO date.</text>
</svg>
