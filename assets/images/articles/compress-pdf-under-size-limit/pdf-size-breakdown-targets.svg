<svg xmlns="http://www.w3.org/2000/svg" width="760" height="295" viewBox="0 0 760 295" role="img" aria-labelledby="pdf-comp-title pdf-comp-desc">
  <title id="pdf-comp-title">What Makes a PDF File Large and How Target-Size Compression Works</title>
  <desc id="pdf-comp-desc">Breakdown of PDF file weight showing scanned color images taking 80-90% of bytes, embedded fonts taking 5-15%, and text streams under 5%, plus compression actions for 1 MB, 500 KB, and 200 KB targets.</desc>
  <rect width="760" height="295" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Where PDF File Size Comes From &amp; How to Hit Your Upload Limit</text>

  <!-- Stacked Bar -->
  <text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">Typical 8 MB Scanned PDF Breakdown:</text>
  <rect x="30" y="84" width="540" height="36" rx="6" fill="#047857"/>
  <text x="44" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Scanned Color Page Images (80–90% of file weight)</text>
  <rect x="574" y="84" width="100" height="36" rx="6" fill="#065f46"/>
  <text x="586" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fonts (~10%)</text>
  <rect x="678" y="84" width="52" height="36" rx="6" fill="#475569"/>
  <text x="690" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Text</text>

  <!-- Three Targets -->
  <rect x="30" y="142" width="220" height="126" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="46" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#047857">Target: Under 1 MB</text>
  <text x="46" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• 150–200 DPI images</text>
  <text x="46" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Medium JPEG quality</text>
  <text x="46" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">• Keeps color stamps sharp</text>

  <rect x="270" y="142" width="220" height="126" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="286" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#047857">Target: Under 500 KB</text>
  <text x="286" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• 120–150 DPI resolution</text>
  <text x="286" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Strip un-needed metadata</text>
  <text x="286" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">• Subset embedded fonts</text>

  <rect x="510" y="142" width="220" height="126" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
  <text x="526" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#065f46">Target: Under 200 KB</text>
  <text x="526" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Convert scans to Grayscale</text>
  <text x="526" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• 96–120 DPI page images</text>
  <text x="526" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569">• Remove blank/extra pages</text>
</svg>
