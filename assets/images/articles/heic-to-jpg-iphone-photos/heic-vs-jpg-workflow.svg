<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="heic-title heic-desc">
  <title id="heic-title">How iPhone HEIC Photos Convert to Compatible JPG Files Across Devices</title>
  <desc id="heic-desc">Comparison of iPhone HEIC container versus universal JPG compatibility on Windows, Android, and web upload forms.</desc>
  <rect width="760" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Why HEIC Fails on Forms &amp; How Conversion Fixes It</text>

  <rect x="30" y="64" width="280" height="194" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="48" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#92400e">iPhone Default: .HEIC</text>
  <text x="48" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Uses HEVC (H.265) compression</text>
  <text x="48" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• ~40-50% smaller on iPhone storage</text>
  <text x="48" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#b91c1c">• Needs HEVC codec on Windows</text>
  <text x="48" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#b91c1c">• Rejected by most exam &amp; visa forms</text>
  <text x="48" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#92400e">Never rename .heic to .jpg manually</text>

  <path d="M326 160h108m-8-7l8 7-8 7" stroke="#047857" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="334" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">Re-encode pixels</text>

  <rect x="450" y="64" width="280" height="194" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="468" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#065f46">Converted Output: .JPG</text>
  <text x="468" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Standard JPEG header (FF D8 FF)</text>
  <text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a">• Converts color profile to sRGB</text>
  <text x="468" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#065f46">• Opens on all Windows &amp; Android PCs</text>
  <text x="468" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#065f46">• Accepted by all web upload portals</text>
  <text x="468" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#065f46">Set iPhone Transfer to "Automatic"</text>
</svg>
